<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Add2Wallet</title>
<meta name="description" content="A quiet, fast tool for turning a ticket, coupon, or membership card into a signed Apple Wallet pass." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='48' fill='%230e1517'/%3E%3Cpath fill='%2314bbc2' d='M196,136a16,16,0,1,1-16-16A16,16,0,0,1,196,136Zm40-36v80a32,32,0,0,1-32,32H60a32,32,0,0,1-32-32V60.92A32,32,0,0,1,60,28H192a12,12,0,0,1,0,24H60a8,8,0,0,0-8,8.26v.08A8.32,8.32,0,0,0,60.48,68H204A32,32,0,0,1,236,100Zm-24,0a8,8,0,0,0-8-8H60.48A33.72,33.72,0,0,1,52,90.92V180a8,8,0,0,0,8,8H204a8,8,0,0,0,8-8Z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Design tokens mirrored from app/globals.css + DESIGN.md ("The Quiet
     Counter"). This page is a static GitHub Pages landing page that points
     at the real app (deployed on Vercel, where the server/API routes and
     Apple signing certs actually live) — GitHub Pages only serves static
     files, so it can't run the app itself. */
  :root {
    --color-bg: oklch(98% 0.004 210);
    --color-bg-subtle: oklch(95.5% 0.006 210);
    --color-fg: oklch(23% 0.014 210);
    --color-fg-muted: oklch(46% 0.014 210);
    --color-fg-faint: oklch(62% 0.012 210);
    --color-border: oklch(87% 0.009 210);
    --color-border-strong: oklch(78% 0.012 210);

    --color-accent: oklch(52% 0.1 200);
    --color-accent-hover: oklch(46% 0.11 200);
    --color-accent-active: oklch(41% 0.11 200);
    --color-accent-fg: oklch(99% 0.004 200);

    --radius-control: 10px;
    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --duration-fast: 120ms;
    --duration-base: 200ms;

    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: oklch(19% 0.012 210);
      --color-bg-subtle: oklch(24% 0.014 210);
      --color-fg: oklch(93% 0.008 210);
      --color-fg-muted: oklch(68% 0.014 210);
      --color-fg-faint: oklch(52% 0.014 210);
      --color-border: oklch(33% 0.018 210);
      --color-border-strong: oklch(42% 0.02 210);

      --color-accent: oklch(72% 0.12 200);
      --color-accent-hover: oklch(78% 0.11 200);
      --color-accent-active: oklch(66% 0.13 200);
      --color-accent-fg: oklch(14% 0.01 200);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; padding: 0; margin: 0; }

  html, body { max-width: 100vw; overflow-x: hidden; }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 64px;
    color: var(--color-fg);
    background: var(--color-bg);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  a { color: inherit; }

  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
    border-radius: calc(var(--radius-control) / 2);
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    max-width: 640px;
    margin-bottom: 40px;
    color: var(--color-fg-faint);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  main {
    width: 100%;
    max-width: 340px;
    margin-top: 8vh;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }

  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }

  .subtitle { font-size: 14px; color: var(--color-fg-muted); }

  .actions { display: flex; flex-direction: column; gap: 10px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-control);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.005em;
    white-space: nowrap;
    text-decoration: none;
    transition:
      background-color var(--duration-base) var(--ease-out-quart),
      border-color var(--duration-base) var(--ease-out-quart),
      color var(--duration-base) var(--ease-out-quart),
      transform var(--duration-fast) var(--ease-out-quart);
  }

  .btn:active { transform: scale(0.98); }

  .btn-primary { background: var(--color-accent); color: var(--color-accent-fg); }
  .btn-primary:hover { background: var(--color-accent-hover); }
  .btn-primary:active { background: var(--color-accent-active); }

  .btn-ghost { background: transparent; color: var(--color-fg-muted); border: 1px solid var(--color-border); }
  .btn-ghost:hover { color: var(--color-fg); border-color: var(--color-border-strong); }

  .note { font-size: 13px; color: var(--color-fg-faint); }

  @media (max-width: 480px) {
    main { margin-top: 4vh; }
  }
</style>
</head>
<body>
  <div class="wordmark">
    <svg width="16" height="16" viewBox="0 0 256 256" aria-hidden="true">
      <path fill="currentColor" d="M196,136a16,16,0,1,1-16-16A16,16,0,0,1,196,136Zm40-36v80a32,32,0,0,1-32,32H60a32,32,0,0,1-32-32V60.92A32,32,0,0,1,60,28H192a12,12,0,0,1,0,24H60a8,8,0,0,0-8,8.26v.08A8.32,8.32,0,0,0,60.48,68H204A32,32,0,0,1,236,100Zm-24,0a8,8,0,0,0-8-8H60.48A33.72,33.72,0,0,1,52,90.92V180a8,8,0,0,0,8,8H204a8,8,0,0,0,8-8Z"/>
    </svg>
    <span>Add2Wallet</span>
  </div>

  <main>
    <div class="header">
      <h1>Add2Wallet</h1>
      <p class="subtitle">A quiet, fast tool for turning a ticket, coupon, or membership card into a signed Apple Wallet pass.</p>
    </div>

    <div class="actions">
      <!-- TODO: swap in the real Vercel production URL once deployed. -->
      <a class="btn btn-primary" href="https://add2wallet.vercel.app">Open Add2Wallet</a>
      <a class="btn btn-ghost" href="https://github.com/aryamanw/Add2Wallet">View source</a>
    </div>

    <p class="note">Personal tool, password protected. This page is a static redirect — the app itself runs on Vercel.</p>
  </main>
</body>
</html>
